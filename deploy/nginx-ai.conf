# ============================================================================
# AI 全栈教学站（/ai/）nginx 缓存策略示例
#
# 背景：线上曾对同一请求同时下发两条语义冲突的缓存头：
#     Cache-Control: no-cache, must-revalidate
#     Cache-Control: public, max-age=3600
# 实际效果 ≈ 永不缓存，静态资源每次都全量回源，白耗带宽。
# 常见原因：server{} 层和 location{} 层各写了一条 add_header Cache-Control。
#
# 修复原则：
#   1. server{} 层不要保留针对 /ai/ 的 add_header Cache-Control（或删除重复那条）；
#   2. 每个 location 只下发一条 Cache-Control；
#   3. HTML 短缓存（内容常更新），css/js/图片/字体长缓存。
#
# 改完执行：nginx -t && nginx -s reload
# 验证方式（应只输出一行 Cache-Control）：
#     curl -sI https://carljings.top/ai/ | grep -i cache-control
#     curl -sI https://carljings.top/ai/assets/style.css | grep -i cache-control
# ============================================================================

# HTML：内容更新频繁，缓存 10 分钟，配合已开启的 ETag/Last-Modified 条件请求
location ~* ^/ai/(.+\.html)$ {
    alias /var/www/ai-tutorial/$1;              # ← 改成实际部署路径
    add_header Cache-Control "public, max-age=600";
}

# 静态资源：低频改动，缓存 7 天
location ~* ^/ai/(.+)\.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    alias /var/www/ai-tutorial/$1.$2;           # ← 改成实际部署路径
    add_header Cache-Control "public, max-age=604800";
}

# 兜底：目录与其他文件
location /ai/ {
    alias /var/www/ai-tutorial/;                # ← 改成实际部署路径
    index index.html;
    try_files $uri $uri/ /ai/index.html;
}
